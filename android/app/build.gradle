plugins { id 'com.android.application' }

// The release key comes from the build machine's environment (GitHub secrets), never from the repo.
def ks = System.getenv('TP_KEYSTORE')

android {
    namespace 'ir.trustparadise.app'
    compileSdk 34
    defaultConfig {
        applicationId 'ir.trustparadise.app'
        minSdk 24
        targetSdk 34
        versionCode((System.getenv('GITHUB_RUN_NUMBER') ?: '1') as int)
        versionName "1.0.${System.getenv('GITHUB_RUN_NUMBER') ?: '0'}"
    }
    signingConfigs {
        release {
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv('TP_KEYSTORE_PASSWORD')
                keyAlias System.getenv('TP_KEY_ALIAS') ?: 'trust'
                keyPassword System.getenv('TP_KEY_PASSWORD') ?: System.getenv('TP_KEYSTORE_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (ks) signingConfig signingConfigs.release
        }
    }
    buildFeatures { buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
